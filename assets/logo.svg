<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" width="200" height="48">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
  </defs>
  <!-- MC Badge -->
  <rect x="0" y="4" width="40" height="40" rx="8" fill="url(#logoGrad)"/>
  <text x="20" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="middle">MC</text>
  <!-- Company Name -->
  <text x="52" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="white">Matthew Carlson</text>
  <text x="52" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#94a3b8">Consulting</text>
</svg>
